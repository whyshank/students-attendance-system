<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 410px;
            padding: 40px 35px 45px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .system-title {
            color: #666666;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .logo-box {
            width: 70px;
            height: 70px;
            background: #289acb;
            border-radius: 12px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .logo-box svg {
            width: 42px;
            height: 42px;
            fill: #ffffff;
        }

        .panel-title {
            color: #4a4a4a;
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-control {
            width: 100%;
            height: 42px;
            padding: 8px 14px;
            font-size: 14px;
            color: #555555;
            background-color: #ffffff;
            border: 1px solid #d2d6de;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus {
            border-color: #3c8dbc;
        }

        select.form-control {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c555555' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 14px;
            cursor: pointer;
        }

        .form-control::placeholder {
            color: #777777;
        }

        .btn-login {
            width: 100%;
            height: 42px;
            background-color: #5cb85c;
            border: 1px solid #4cae4c;
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-login:hover {
            background-color: #4cae4c;
            border-color: #47a447;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="system-title">Student Attendance System</h1>
        
        <div class="logo-box">
            <svg viewBox="0 0 64 64">
                <path d="M 38,16 A 7,7 0 1,1 24,16 A 7,7 0 1,1 38,16 Z" />
                <path d="M 18,44 C 18,34 25,28 35,28 C 39,28 42,29 44,31 L 38,36 C 36,34 33,34 31,34 C 25,34 22,38 22,44 Z" />
                <path d="M 18,44 L 46,44 L 46,40 L 18,40 Z" />
            </svg>
        </div>

        <h2 class="panel-title">Login Panel</h2>

        <!-- Added ID to form and removed action="#" -->
        <form id="loginForm">
            <div class="form-group">
                <!-- Added ID to select -->
                <select class="form-control" name="role" id="roleSelect">
                    <option value="administrator">Administrator</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                </select>
            </div>

            <div class="form-group">
                <input type="email" class="form-control" placeholder="Enter Email Address" required>
            </div>

            <div class="form-group">
                <input type="password" class="form-control" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>

    <!-- JavaScript to handle the redirection -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // Prevent the form from refreshing the page
            event.preventDefault();

            // Get the value from the dropdown menu
            const selectedRole = document.getElementById('roleSelect').value;

            // Route the user based on their selection
            if (selectedRole === 'student') {
                // Make sure your dashboard file is named exactly like this in the same folder
                window.location.href = 'student-dashboard.html';
            } else if (selectedRole === 'teacher') {
                alert('The Teacher dashboard is not built yet!');
                // window.location.href = 'teacher-dashboard.html';
            } else if (selectedRole === 'administrator') {
                alert('The Administrator dashboard is not built yet!');
                // window.location.href = 'admin-dashboard.html';
            }
        });
    </script>
</body>
</html>
