<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System - Login</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>

    <div class="login-card">
        <h1 class="system-title">Student Attendance System</h1>
        
        <div class="logo-box">
            <svg viewBox="0 0 64 64">
                <path d="M 38,16 A 7,7 0 1,1 24,16 A 7,7 0 1,1 38,16 Z" />
                <path d="M 18,44 C 18,34 25,28 35,28 C 39,28 42,29 44,31 L 38,36 C 36,34 33,34 31,34 C 25,34 22,38 22,44 Z" />
                <path d="M 18,44 L 46,44 L 46,40 L 18,40 Z" />
            </svg>
        </div>

        <h2 class="panel-title">Sign In</h2>

        <form id="loginForm">
            <!-- Removed the role dropdown entirely -->
            
            <div class="form-group">
                <!-- Changed type from email to text so it accepts IDs, and added an ID to grab the value -->
                <input type="text" id="loginInput" class="form-control" placeholder="Enter your user ID: " required autocomplete="off">
            </div>

            <div class="form-group">
                <input type="password" class="form-control" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
            <a href="register.html" style="display: block; margin-top: 20px; font-size: 14px; color: #666; text-decoration: none;">
                Don't have an account?
                <span style="color: #289acb; font-weight: 500;">
                    Register Here
                </span>
            </a>
        </form>
    </div>
</body>
</html>
